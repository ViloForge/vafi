{{/*
ServiceAccounts for the vtaskforge variables substrate.

The vafi executor and judge Deployments authenticate to Vault using
these SAs via the K8s auth method. The corresponding Vault auth roles
(vtaskforge-executor, vtaskforge-judge) and policies are managed by
the viloforge-platform vault-bootstrap role; see
viloforge-platform/docs/vtaskforge-variables-DESIGN.md
§"Implementation phasing vs target architecture" for the α (single-SA-
per-role) shape this implements.

Names are FIXED (no fullnameOverride substitution) because the Vault
auth role binds bound_service_account_names by literal name. Renaming
either side breaks authentication silently.

Both SAs are unconditional — judge runs at replicas=0 in some
environments, but the SA still needs to exist so Vault policy fixtures
referenced in design docs/runbooks resolve consistently.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vtaskforge-executor
  labels:
    {{- include "vafi.labels" . | nindent 4 }}
    {{- include "vafi.selectorLabels" (dict "root" . "component" "executor") | nindent 4 }}
    vtaskforge.viloforge.com/substrate: variables
    vtaskforge.viloforge.com/role: executor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vtaskforge-judge
  labels:
    {{- include "vafi.labels" . | nindent 4 }}
    {{- include "vafi.selectorLabels" (dict "root" . "component" "judge") | nindent 4 }}
    vtaskforge.viloforge.com/substrate: variables
    vtaskforge.viloforge.com/role: judge
