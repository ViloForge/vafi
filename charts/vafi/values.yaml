# vafi Helm chart values
# See docs/helm-migration-PLAN.md for full documentation.

# -- Container images
image:
  agent:
    repository: vafi-agent
    tag: latest
    pullPolicy: Always
  base:
    repository: vafi-base
    tag: latest
  cxdb:
    repository: cxdb
    tag: latest
    pullPolicy: Always

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override release name
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Executor — AI agent that polls for and executes tasks
# ---------------------------------------------------------------------------
executor:
  replicas: 1
  role: executor
  # R4 (routing determinism, F5): the Claude and Pi executor pools carry
  # DISJOINT capability tags ("claude" vs "pi") with no shared "executor"
  # tag. vtaskforge claim matching is subset-based (task.required_tags must
  # be a subset of the agent's tags), so a task pins exactly one harness via
  # required_tags=[claude] or [pi]; there is no generic tag that matches both
  # pools, making cross-harness routing impossible by construction. (Before
  # R4 both pools shared "executor"; required_tags=[executor] matched both.)
  tags: "claude"
  # Optional explicit identity override. When empty (default) the controller
  # derives the agent name from the sorted tag set (e.g. "executor" or
  # "executor-pi"); see vafi#3 / controller commit e71e2af. Set per
  # deployment when you need to pin distinct identities for two pods that
  # share role+tags but should register as separate agents.
  agentId: ""
  pollInterval: 30
  taskTimeout: 600
  maxRework: 3
  maxTurns: 50
  heartbeatInterval: 300
  sessionsDir: "/sessions"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Executor (Pi harness) — Pi-based agent for pi-tagged tasks
# ---------------------------------------------------------------------------
# Runs a separate deployment of the executor controller with the pi harness
# image. Agents register with the disjoint tag "pi" (R4 routing determinism)
# and only claim tasks pinned to required_tags=[pi]. Set replicas to 0 /
# enabled:false to disable.
executorPi:
  # Disabled by default — enable per-environment (see vafi-deploy/environments/*.yaml).
  # Prevents unused pi executor pods in environments with no pi workload.
  enabled: false
  replicas: 1
  # Dedicated sessions PVC. When `dedicated: false` (default) the pi
  # executor mounts the shared `vafi-sessions` PVC alongside the claude
  # executor. This only works on single-node clusters (RWO). For
  # multi-node clusters, set `dedicated: true` to provision a separate
  # `vafi-sessions-pi` PVC so the two pods never race for the volume.
  sessionsPvc:
    dedicated: false
    storage: ""              # empty = inherit .Values.sessions.storage
    storageClassName: ""     # empty = inherit .Values.sessions.storageClassName
  role: executor
  tags: "pi"               # R4: disjoint from the Claude pool's "claude"
  agentId: ""              # see executor.agentId for override semantics
  pollInterval: 30
  taskTimeout: 600
  maxRework: 3
  maxTurns: 50
  heartbeatInterval: 300
  sessionsDir: "/sessions"
  harness: "pi"
  piProvider: "anthropic"
  piModel: "claude-sonnet-4-20250514"
  outputFormat: "pi_jsonl"
  image:
    repository: harbor.viloforge.com/vafi/vafi-agent-pi
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Judge — AI agent that reviews completed tasks
# ---------------------------------------------------------------------------
judge:
  replicas: 0              # 0 = disabled by default
  role: judge
  tags: "judge"
  agentId: ""              # see executor.agentId for override semantics
  pollInterval: 30
  taskTimeout: 600
  maxTurns: 50
  heartbeatInterval: 300
  sessionsDir: "/sessions"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Bridge — REST+WebSocket service that brokers console→agent-pod sessions
# ---------------------------------------------------------------------------
bridge:
  enabled: true
  replicas: 1
  image:
    repository: harbor.viloforge.com/vafi/vafi-bridge
    tag: latest
    pullPolicy: Always
  # Image used for locked agent pods (architect/web_designer) spawned by the
  # bridge. Accepts either:
  #   - legacy string:    "harbor.viloforge.com/vafi/vafi-agent-pi:latest"
  #   - map (preferred):  { repository: "...", tag: "..." }
  # The map form is required if a build pipeline bumps the tag in isolation;
  # the legacy form is still supported so existing values files keep working.
  agentPiImage: "harbor.viloforge.com/vafi/vafi-agent-pi:latest"
  # Phase 9: mount the same PVC the architect pods use, read-only, so the
  # bridge can serve GET /v1/sessions/history from Pi's JSONL files.
  # Only works when the PVC supports multi-mount OR bridge + architect pods
  # co-locate on the same node (which is the case for dev's single-node k3s
  # with RWO + local-path).
  sessionsReadonlyMount: true
  # Empty default = chart's own sessions PVC (`<fullname>-sessions`). Override
  # only if the bridge needs to read a PVC owned outside this release.
  sessionsPVC: ""
  service:
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  rolesConfig: |
    roles:
      architect:
        session_type: locked
        model: claude-sonnet-4-20250514
        thinking_level: medium
        methodology: /opt/vf-agent/methodologies/architect.md
        mcp_tools:
          - vtf
          - cxdb
        idle_timeout_hours: 4
        description: Interactive planning and design sessions

      assistant:
        session_type: ephemeral
        model: claude-sonnet-4-20250514
        thinking_level: low
        methodology: ""
        mcp_tools:
          - vtf
          - cxdb
        description: Task management, status queries, quick operations

# ---------------------------------------------------------------------------
# vtf — task tracker API that the executor polls for work
# ---------------------------------------------------------------------------
vtf:
  apiUrl: ""               # required — in-cluster vtf API URL
  mcpUrl: ""               # required for bridge — in-cluster vtf MCP URL (e.g. http://vtf-mcp.<ns>.svc.cluster.local:8002/mcp)

# ---------------------------------------------------------------------------
# vfobs observability emission (WG5-min). Default OFF — agents run
# exactly as before unless explicitly enabled. When enabled the
# controller emits task.* / harness.* events to vfobs (fire-and-
# forget; never on the critical path). emitToken comes from the
# vafi-secrets key `vfobs-ingest-token` (the vfobs WG1 ingest token).
# ---------------------------------------------------------------------------
vfobs:
  emitEnabled: false
  emitUrl: ""              # e.g. http://vfobs.vfobs-dev.svc.cluster.local:8080

# ---------------------------------------------------------------------------
# CXDB — execution trace store (disable if not using trace collection)
# ---------------------------------------------------------------------------
cxdb:
  enabled: true
  publicUrl: ""            # external URL for trace links (shown in vtf UI)
  storage: 10Gi
  storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 2
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3

# ---------------------------------------------------------------------------
# cxdb-mcp — MCP server that exposes the cxdb store to agents.
# Migrated from vilosource/vafi-deploy:cxdb-mcp/ in 2026-05; lifecycle now
# tracks the vafi chart so versions can't drift.
# ---------------------------------------------------------------------------
cxdbMcp:
  enabled: true
  replicas: 1
  image:
    repository: harbor.viloforge.com/vafi/vafi-cxdb-mcp
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# Sessions — shared volume for per-task working directories
# ---------------------------------------------------------------------------
sessions:
  storage: 10Gi
  storageClassName: ""
  # PVC accessModes. Default RWO matches single-node clusters (e.g. local-path
  # dev). Multi-node clusters where executor + executor-pi + bridge all want to
  # mount this volume need ReadWriteMany — Longhorn provisions an RWX volume
  # via its share-manager when this is set.
  accessModes:
    - ReadWriteOnce

# ---------------------------------------------------------------------------
# Ingress — external access to CXDB web UI
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  cxdbHost: ""
  tls:
    enabled: false
    secretName: cxdb-tls

# ---------------------------------------------------------------------------
# cert-manager Certificate
# ---------------------------------------------------------------------------
certificate:
  enabled: false
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

# ---------------------------------------------------------------------------
# Secrets
# Set existingSecret to use a pre-created secret (recommended for production).
# Otherwise the chart generates vafi-secrets from the values below.
# The github-ssh secret is always pre-created out-of-band.
# ---------------------------------------------------------------------------
secrets:
  existingSecret: ""
  anthropicAuthToken: ""
  anthropicBaseUrl: "https://api.anthropic.com"
  vtfToken: ""

sshSecret:
  name: github-ssh

# Optional belt-and-braces defense for vafi#37 (judge role-boundary leak).
# The judge pod is a verifier, not an author — its prompt forbids any git
# write operation (see context.py role='judge' instruction). If you also
# want the *capability* removed, provision a read-only deploy key on each
# verifiable repo, store it in a separate Kubernetes secret, and set
# `judgeSshSecret.name` here. When empty (default), the judge mounts the
# same `sshSecret.name` as the executors — backwards-compatible.
judgeSshSecret:
  name: ""
